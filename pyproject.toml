[project]
name = "virtual-theatre-backend-service"
version = "0.1.0"
description = "Virtual theatre backend service"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Armen Petrosyan", email = "armenpetrosan319@example.com" },
]
dependencies = [
    "alembic==1.14.1",
    "asyncpg==0.30.0",
    "fastapi==0.115.6",
    "loguru==0.7.3",
    "psycopg[binary]>=3.3.5",
    "pydantic==2.10.4",
    "pydantic-settings==2.6.1",
    "redis==5.2.1",
    "sqlalchemy==2.0.36",
    "uvicorn[standard]==0.34.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-mock==3.14.0",
    "testcontainers==4.9.1",
    "httpx==0.28.1"
]
